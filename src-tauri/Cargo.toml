[package]
name = "privatevoice"
version = "1.0.0"
description = "PrivateVoice - Local text-to-speech desktop app"
authors = ["jmoore"]
edition = "2021"

[lib]
name = "privatevoice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
sha2 = "0.10"
tauri-plugin-mcp-bridge = { version = "0.6", optional = true }

[features]
default = []
mcp-bridge = ["tauri-plugin-mcp-bridge"]
