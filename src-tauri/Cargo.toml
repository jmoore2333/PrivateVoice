[package]
name = "privatevoice"
version = "0.1.0"
description = "PrivateVoice - Local text-to-speech for Apple Silicon"
authors = ["jmoore"]
edition = "2021"

[lib]
name = "privatevoice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
