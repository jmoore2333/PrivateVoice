[package]
name = "privatevoice"
version = "1.0.3"
description = "PrivateVoice - Local text-to-speech desktop app"
authors = ["jmoore"]
edition = "2021"

[lib]
name = "privatevoice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
sha2 = "0.10"
rand = "0.8"
tauri-plugin-mcp-bridge = { version = "0.6", optional = true }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0.1", features = ["v2_38"] }

[features]
default = []
mcp-bridge = ["tauri-plugin-mcp-bridge"]
