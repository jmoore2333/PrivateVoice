name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Sync SvelteKit
        run: pnpm exec svelte-kit sync

      - name: Run lint and type check
        run: pnpm check

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Sync SvelteKit
        run: pnpm exec svelte-kit sync

      - name: Run unit tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Sync SvelteKit
        run: pnpm exec svelte-kit sync

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Sync SvelteKit
        run: pnpm exec svelte-kit sync

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Backend syntax smoke test
        run: |
          python -m py_compile \
            python/tts_server/main.py \
            python/tts_server/translation.py

          if [ -f "src-tauri/resources/tts_server/main.py" ] && [ -f "src-tauri/resources/tts_server/translation.py" ]; then
            python -m py_compile \
              src-tauri/resources/tts_server/main.py \
              src-tauri/resources/tts_server/translation.py
          fi

      - name: Verify translation API and env refresh guards
        run: |
          grep -q '@app.get("/translation-status"' python/tts_server/main.py
          if [ -f "src-tauri/resources/tts_server/main.py" ]; then
            grep -q '@app.get("/translation-status"' src-tauri/resources/tts_server/main.py
          fi
          grep -q 'source_hash' src-tauri/src/env_manager/validate.rs

      - name: Build frontend
        run: pnpm build
