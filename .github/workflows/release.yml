name: Release

# Builds installers for macOS (Apple Silicon + Intel), Windows and Linux, and
# attaches them to a draft GitHub release. Tauri cannot cross-compile, so each
# platform builds on its own runner.
#
# Trigger by pushing a version tag (v1.0.3), or manually via workflow_dispatch.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and attach the installers to (e.g. v1.0.3)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (Apple Silicon)
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          # macos-13 (Intel) runners are deprecated and can queue indefinitely.
          # Cross-compile the Intel slice from an arm64 runner instead.
          - os: macos-latest
            label: macOS (Intel)
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - os: ubuntu-22.04
            label: Linux (x86_64)
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu
          - os: windows-latest
            label: Windows (x86_64)
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis

    steps:
      - uses: actions/checkout@v4

      # Tauri's Linux bundler needs webkit2gtk and its build-time deps.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf build-essential \
            curl wget file libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # main bundles the uv binary + Python source and installs dependencies on
      # first launch (see scripts/build-release.sh) — there is no PyInstaller
      # sidecar. Reuse the repo's own scripts so CI and local builds cannot drift.
      - name: Download uv binary
        shell: bash
        run: bash scripts/download-uv.sh

      - name: Stage Python source into Tauri resources
        shell: bash
        run: |
          mkdir -p src-tauri/resources
          rm -rf src-tauri/resources/tts_server
          cp -r python/tts_server src-tauri/resources/tts_server
          cp python/requirements.txt src-tauri/resources/requirements.txt

      - name: Verify dependency hash
        shell: bash
        run: bash scripts/verify-dependency-hash.sh

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: PrivateVoice ${{ github.event.inputs.tag || github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
